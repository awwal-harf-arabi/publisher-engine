name: Test publishing engine
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI and system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc fonts-hosny-amiri fonts-noto-core
          pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
